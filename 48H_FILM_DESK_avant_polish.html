<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>48H FILM DESK</title>
<script src="server-config.js"></script>
<script src="sync-shim.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#070708;--p:#101113;--p2:#17181b;--l:#292b2f;--t:#f0efeb;--m:#85878d;--r:#e5252a;--g:#3fae6a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--t);font:13px/1.4 "Barlow Condensed","Arial Narrow",Arial,sans-serif;letter-spacing:.03em;display:flex;flex-direction:column}
.mono{font-family:"SF Mono",Consolas,monospace}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid var(--l);background:var(--p)}
header b{font-size:18px;letter-spacing:.2em}header small{color:var(--m);display:block}
#cd{font:700 44px/1 "SF Mono",Consolas,monospace;color:var(--t)}#cd.low{color:var(--r)}
main{flex:1;display:flex;min-height:0}
nav{width:150px;background:var(--p);border-right:1px solid var(--l);overflow:auto;flex:none}
nav a{display:block;padding:9px 14px;border-bottom:1px solid var(--l);color:var(--m);cursor:pointer;font-size:12px;letter-spacing:.12em}
nav a:hover{background:var(--p2);color:var(--t)}nav a.on{color:var(--t);background:var(--p2);border-left:3px solid var(--t)}
nav a.pn{color:var(--r);font-weight:700}
section{flex:1;padding:16px;overflow:auto}
h2{margin:0 0 12px;font-size:12px;letter-spacing:.25em;color:var(--m);font-weight:600;border-bottom:1px solid var(--l);padding-bottom:6px}
.card{background:var(--p);border:1px solid var(--l);padding:14px;margin-bottom:12px;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.bar{height:8px;background:var(--bg);border:1px solid var(--l);margin:6px 0}.bar i{display:block;height:100%;background:var(--t);transition:width .3s}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
input,select,textarea,button{background:var(--bg);color:var(--t);border:1px solid var(--l);padding:7px 10px;font:inherit;letter-spacing:inherit;border-radius:5px;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}
textarea{width:100%;min-height:90px;font-family:"SF Mono",Consolas,monospace;font-size:12px}
button{cursor:pointer;background:var(--p2);font-weight:600}button:hover{border-color:#5b5e64;background:#1d1f22;box-shadow:0 2px 8px rgba(0,0,0,.25)}button:active{transform:translateY(1px);box-shadow:none}
button.big{padding:14px 20px;font-size:16px;letter-spacing:.15em}button.red{background:var(--r);border-color:var(--r);color:#fff}
.alert{color:var(--r);font-weight:700}.ok{color:var(--g)}.m{color:var(--m)}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--l);padding:5px 6px;text-align:left}th{color:var(--m);font-weight:600;font-size:11px}
td input,td select{width:100%}
.big-t{font-size:30px;font-weight:700}
@media(max-width:700px){nav{width:54px}nav a{font-size:9px;padding:9px 4px}#cd{font-size:26px}}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);align-items:flex-start;justify-content:center;padding-top:12vh;z-index:99999}#md>div{background:var(--p);border:1px solid var(--t);width:min(560px,92vw);padding:12px}#md input{width:100%;font-size:16px}.rs{padding:7px 4px;border-bottom:1px solid var(--l);cursor:pointer}.rs:hover{background:var(--p2)}img{border:1px solid var(--l)}
@media print{header,nav,.np,button{display:none!important}:root{--bg:#fff;--p:#fff;--p2:#fff;--l:#999;--t:#000;--m:#444}html,body,main,section{display:block;height:auto;overflow:visible}}
nav{display:flex;flex-direction:column;width:178px}nav .g{padding:7px 10px;font-size:11px;letter-spacing:.18em;color:var(--t);background:var(--bg);border-bottom:1px solid var(--l);cursor:pointer;font-weight:700;margin-top:4px}nav a{padding:5px 10px 5px 24px;border-bottom:0;font-size:12px}nav a.on{border-left:3px solid var(--t);padding-left:21px}nav a.pn{margin:auto 6px 8px;padding:10px;text-align:center;background:var(--r);color:#fff;font-weight:700}nav a.pn.on{outline:2px solid #fff}
.tabs{position:sticky;top:-16px;z-index:3;background:var(--bg);margin:-16px -16px 14px;padding:0 16px;display:flex;border-bottom:1px solid var(--l);overflow:auto}.tabs a{padding:9px 14px;font-size:12px;letter-spacing:.12em;color:var(--m);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}.tabs a.on{color:var(--t);border-bottom-color:var(--t)}.col{background:var(--p);border:1px solid var(--l);min-width:170px;flex:1;padding:6px;min-height:200px}.hb{display:none}
@media(max-width:800px){.hb{display:inline-block}nav{position:fixed;left:-200px;top:62px;bottom:0;z-index:8;width:190px;transition:left .15s}nav.open{left:0}nav a{font-size:12px;padding:8px 10px 8px 24px}}@media print{.tabs{display:none!important}}
body{font-size:14px;line-height:1.55}section{padding:24px 28px}.card{padding:16px;margin-bottom:14px}h2{font-size:13px;margin:22px 0 12px;padding-bottom:8px}td,th{padding:9px 10px}input,select,textarea,button{padding:8px 10px;font-size:14px}.grid{gap:14px}.row{gap:12px}header{padding:12px 20px}
nav a{font-size:13px;padding:8px 12px 8px 26px;text-transform:lowercase;letter-spacing:.02em}nav a::first-letter{text-transform:uppercase}nav a.pn{text-transform:uppercase;letter-spacing:.12em}nav .g{font-size:12px;padding:11px 12px}
.tabs{margin:-24px -28px 18px;padding:0 28px;top:-24px}.tabs a{font-size:13px;padding:13px 16px}.help{color:var(--m);font-size:13px;margin:0 0 20px;max-width:75ch}#psel{max-width:200px}
@media(min-width:801px){nav{width:210px}}
#home{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;justify-content:center;padding:20px;display:none}.hbox{width:min(560px,100%)}
#bn{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--p);border-top:1px solid var(--l);z-index:7}#bn button{flex:1;border:0;background:none;padding:6px 2px;font-size:18px;position:relative}#bn button.on{background:var(--p2)}#bn small{display:block;font-size:9px;color:var(--m)}
#cb{position:fixed;right:16px;bottom:16px;z-index:14;border-radius:24px;padding:10px 16px}#chat{display:none;flex-direction:column;position:fixed;right:16px;bottom:16px;width:360px;height:min(70vh,560px);background:var(--p);border:1px solid var(--t);z-index:15}#cmsgs{flex:1;overflow:auto;padding:10px}.cm{margin-bottom:10px}.chip{background:var(--p2);border:1px solid var(--l);padding:1px 6px;cursor:pointer;color:var(--t);font-family:monospace}.cbadge{color:var(--r);font-weight:700}
@media(max-width:800px){header{flex-wrap:wrap;gap:6px;padding:8px 10px}header b{font-size:14px;letter-spacing:.1em}header small{display:none}#cd{font-size:28px}header .np{width:100%;flex-wrap:wrap;gap:6px}header .np button,header .np select{padding:6px 8px;font-size:12px}header [onclick^="print"],header [onclick^="expP"],header [onclick^="exp("]{display:none}section{padding:14px 12px 84px}.tabs{margin:-14px -12px 12px;padding:0 6px;top:-14px}#bn{display:flex}#cb{display:none}#chat{inset:0;width:auto;height:auto;bottom:56px}.help{font-size:12px}td,th{padding:6px}}
@media(max-width:800px){header .np{display:none}header small#pn{display:block;font-size:11px;letter-spacing:.05em}.tabs,.help{display:none}button.big{padding:16px 14px;font-size:16px}#bn button{padding:8px 2px;font-size:20px}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body>
<header><div><b>48H FILM DESK</b><small id="pn" class="mono"></small></div><div style="text-align:right"><small>TEMPS RESTANT</small><div id="cd">--:--:--</div></div></header>
<main><nav id="nav"></nav><section id="v"></section></main>
<script>
/* SOMMAIRE : V1 modules de base · V2 données reliées (R2) · V3 workspaces et nouveaux modules (R3) · V4 lisibilité et projets · V5 chrono et collaboration · V6 accueil, code tournant, chat, mobile · V7 rôles et vues téléphone */
const PH=["ÉCRITURE","PRÉPRODUCTION","TOURNAGE","POST-PRODUCTION"];
const def=()=>({name:"LA DERNIÈRE PORTE",max:8,start:Date.now(),deadline:Date.now()+48*36e5,
scenes:[{h:"INT. MAISON — NUIT",txt:"Thomas entre, une clé à la main.\nTHOMAS: Tu n'aurais jamais dû revenir.",chars:"Thomas",done:false}],
shots:[],vfx:[],rushes:[],cons:[{k:"THÈME",v:"Le retour"},{k:"OBJET",v:"Une clé"},{k:"PHRASE IMPOSÉE",v:"Tu n'aurais jamais dû revenir."}],
manual:{0:0,1:0},cur:0});
let FRESH=false;try{if(localStorage.getItem("f48_v6")!=="1"||localStorage.getItem("f48_fresh")==="1"){const a=localStorage.getItem("f48_all");if(a)localStorage.setItem("f48_pre_reset",a);["f48_all","f48","f48_collab","f48_bak","f48_fresh"].forEach(k=>localStorage.removeItem(k));localStorage.setItem("f48_v6","1");FRESH=true}}catch(e){}
let ALL;try{ALL=JSON.parse(localStorage.getItem("f48_all"))}catch(e){}
if(!ALL||!ALL.list){let o;try{o=JSON.parse(localStorage.getItem("f48"))}catch(e){}o=o||def();o.id="p1";ALL={cur:"p1",list:{p1:o}}}
let S=ALL.list[ALL.cur]||def();
const save=()=>{try{ALL.list[ALL.cur]=S;localStorage.setItem("f48_all",JSON.stringify(ALL))}catch(e){}if(window.pushSync)pushSync()};
let mod="DASHBOARD";
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0");
const hms=ms=>{ms=Math.max(0,ms)/1e3|0;return pad(ms/3600|0)+":"+pad(ms%3600/60|0)+":"+pad(ms%60)};
const mmss=s=>pad(s/60|0)+":"+pad(s%60|0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function sceneDur(sc){const w=sc.txt.trim().split(/\s+/).filter(Boolean).length;const sh=S.shots.filter(x=>x.s==S.scenes.indexOf(sc)).reduce((a,x)=>a+(+x.d||0),0);return sh||Math.round(w/2.5)}
const total=()=>S.scenes.reduce((a,s)=>a+sceneDur(s),0);
function prog(){const sc=S.scenes.length||1;
const w=Math.min(100,S.manual[0]||0);
const pre=Math.min(100,S.shots.length?Math.round(S.shots.filter(x=>x.l||x.cam).length/S.shots.length*100):0);
const ta=S.shots.length?Math.round(S.shots.filter(x=>x.ok).length/S.shots.length*100):0;
const po=Math.min(100,S.manual[1]||0);return [w,pre,ta,po]}
function bar(p){return `<div class="bar"><i style="width:${p}%"></i></div>`}
function tick(){const left=S.deadline-NOW();const c=$("#cd");c.textContent=hms(left);c.className=left<36e5*3?"low":"";
$("#pn").textContent="PROJET : "+S.name}
setInterval(tick,1000);
function problems(){const p=[];const txt=S.scenes.map(s=>s.txt).join(" ").toLowerCase();
S.cons.forEach(c=>{const w=c.v.toLowerCase().replace(/[«»]/g,"").trim();const key=w.length>25?w:w.split(" ").pop();if(w&&!txt.includes(w)&&!txt.includes(key))p.push("⚠ Contrainte absente du scénario : "+c.k+" — "+c.v)});
const t=total();if(t>S.max*60)p.push("⚠ FILM TROP LONG — "+mmss(t-S.max*60)+" SUPPLÉMENTAIRES");
const nok=S.shots.filter(x=>!x.ok).length;if(nok)p.push("❌ "+nok+" plan(s) non validé(s)");
const nv=S.vfx.filter(x=>x.st!="TERMINÉ").length;if(nv)p.push("❌ "+nv+" VFX non terminé(s)");
S.shots.forEach((x,i)=>{if(!x.son)p.push("⚠ PLAN "+(i+1)+" : son non défini")});return p}
function render0(){const v=$("#v");
if(mod=="DASHBOARD"){const P=prog(),pr=problems();
v.innerHTML=`<h2>ÉTAT DU FILM</h2><div class="grid">`+PH.map((n,i)=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${n}</b><span class="big-t mono">${P[i]}%</span></div>${bar(P[i])}<div class="m mono">${P[i]>=100?"TERMINÉ":P[i]>0?"EN COURS":"À DÉMARRER"} · ${i==0?"scènes: "+S.scenes.length:i==1?"plans: "+S.shots.length:i==2?S.shots.filter(x=>x.ok).length+"/"+S.shots.length+" validés":"manuel"}</div>${i==0||i==3?`<input type="range" min="0" max="100" value="${S.manual[i==0?0:1]}" oninput="S.manual[${i==0?0:1}]=+this.value;save()" onchange="render()">`:""}</div>`).join("")+`</div>
<div class="card"><div class="row"><span class="m">DURÉE ESTIMÉE</span><span class="big-t mono ${total()>S.max*60?"alert":""}">${mmss(total())}</span><span class="m">/ MAX ${S.max}:00</span></div></div>
<h2>À TRAITER (${pr.length})</h2><div class="card">${pr.length?pr.map(x=>`<div class="${x[0]=="❌"||x[0]=="⚠"?"alert":""}">${esc(x)}</div>`).join(""):'<span class="ok">Rien à signaler.</span>'}</div>`}
else if(mod=="SCÉNARIO"){
v.innerHTML=`<h2>SCÉNARIO — <span class="mono">DURÉE ESTIMÉE : ${mmss(total())}</span></h2>${total()>S.max*60?`<div class="alert card">⚠ FILM TROP LONG — ${mmss(total()-S.max*60)} SUPPLÉMENTAIRES</div>`:""}
<div class="card"><div class="row"><b>CONTRAINTES</b><button onclick="S.cons.push({k:'NOUVELLE',v:''});save();render()">+</button></div>${S.cons.map((c,i)=>`<div class="row"><input value="${esc(c.k)}" style="width:150px" onchange="S.cons[${i}].k=this.value;save()"><input value="${esc(c.v)}" style="flex:1" onchange="S.cons[${i}].v=this.value;save();render()"><button onclick="S.cons.splice(${i},1);save();render()">✕</button></div>`).join("")}</div>`+
S.scenes.map((s,i)=>`<div class="card"><div class="row"><b class="mono">SCÈNE ${pad(i+1)}</b><input value="${esc(s.h)}" style="flex:1" onchange="S.scenes[${i}].h=this.value;save()"><input value="${esc(s.chars)}" placeholder="Personnages" onchange="S.scenes[${i}].chars=this.value;save()"><span class="mono">${mmss(sceneDur(s))}</span><button onclick="S.scenes.splice(${i},1);save();render()">✕</button></div><textarea oninput="S.scenes[${i}].txt=this.value;save()" onchange="render()">${esc(s.txt)}</textarea></div>`).join("")+
`<button onclick="S.scenes.push({h:'INT. LIEU — JOUR',txt:'',chars:'',done:false});save();render()">+ SCÈNE</button>`}
else if(mod=="DÉCOUPAGE"){
v.innerHTML=`<h2>DÉCOUPAGE TECHNIQUE</h2><div style="overflow:auto"><table><tr><th>SC</th><th>PLAN</th><th>TYPE</th><th>MM</th><th>CAM</th><th>MOUVEMENT</th><th>DURÉE s</th><th>LUMIÈRE</th><th>SON</th><th>VFX</th><th></th></tr>`+
S.shots.map((x,i)=>`<tr><td><select onchange="S.shots[${i}].s=+this.value;save()">${S.scenes.map((_,j)=>`<option value="${j}" ${x.s==j?"selected":""}>${pad(j+1)}</option>`).join("")}</select></td><td class="mono">${pad(i+1)}</td>`+
[["t"],["f"],["cam"],["mv"],["d"],["l"],["son"],["vfx"]].map(([k])=>`<td><input value="${esc(x[k]||"")}" onchange="S.shots[${i}].${k}=this.value;save()"></td>`).join("")+`<td><button onclick="S.shots.splice(${i},1);save();render()">✕</button></td></tr>`).join("")+`</table></div><br><button onclick="S.shots.push({id:uid(),s:0,t:'Plan moyen',f:'35',cam:'A',mv:'Fixe',d:5,l:'',son:'',vfx:'',takes:[]});save();render()">+ PLAN</button>`}
else if(mod=="TOURNAGE"){const x=S.shots[S.cur];
if(!x){v.innerHTML=`<h2>TOURNAGE</h2><div class="card m">Ajoute d'abord des plans dans DÉCOUPAGE.</div>`;return}
x.takes=x.takes||[];x.chk=x.chk||{};const sc=S.scenes[x.s]||{h:""};
v.innerHTML=`<div class="row" style="justify-content:space-between"><span class="m mono">PLAN ${S.cur+1}/${S.shots.length}</span><span><button onclick="S.cur=Math.max(0,S.cur-1);render()">◀</button> <button onclick="S.cur=Math.min(S.shots.length-1,S.cur+1);render()">▶</button></span></div>
<div class="big-t mono" style="margin:10px 0">SCÈNE ${pad(x.s+1)} / PLAN ${pad(S.cur+1)}</div><div>${esc(sc.h)}</div><div class="big-t">${esc((x.t||"").toUpperCase())} — ${esc(x.f||"")} MM</div><br>
<div class="grid">`+["Caméra","Objectif","Lumière","Son","Acteur","Accessoire"].map(c=>`<label class="card"><input type="checkbox" ${x.chk[c]?"checked":""} onchange="S.shots[S.cur].chk['${c}']=this.checked;save()"> ${c}</label>`).join("")+`</div>
<h2>PRISES</h2>${x.takes.map((t,i)=>`<div class="big-t mono" onclick="S.shots[S.cur].best=${i};save();render()" style="cursor:pointer">TAKE ${pad(i+1)} ${x.best==i?"⭐":"❌"}</div>`).join("")||'<div class="m">Aucune prise.</div>'}<br>
<div class="row"><button class="big" onclick="S.shots[S.cur].takes.push(1);save();render()">NOUVELLE PRISE</button><button class="big" onclick="if(S.shots[S.cur].takes.length){S.shots[S.cur].best=S.shots[S.cur].takes.length-1;save();render()}">BONNE PRISE</button><button class="big red" onclick="S.shots[S.cur].ok=true;if(S.cur<S.shots.length-1)S.cur++;save();render()">PLAN VALIDÉ ${x.ok?"✓":""}</button></div>`}
else if(mod=="RUSHS"){
v.innerHTML=`<h2>RUSHES</h2><div class="card"><div class="row"><select id="rp">${S.shots.map((_,i)=>`<option value="${i}">PLAN ${pad(i+1)}</option>`).join("")}</select><input type="file" id="rf" multiple><button onclick="addR()">ASSOCIER</button></div><div class="m">Seuls les noms de fichiers sont mémorisés (les médias restent sur ton disque).</div></div>
<div class="card">${S.rushes.map((r,i)=>`<div class="row mono"><span>SC${pad((S.shots[r.p]||{s:0}).s+1)}_PLAN${pad(r.p+1)}</span><span style="flex:1">${esc(r.n)}</span><button onclick="S.rushes[${i}].best=!S.rushes[${i}].best;save();render()">${r.best?"⭐":"☆"}</button><button onclick="S.rushes.splice(${i},1);save();render()">✕</button></div>`).join("")||'<span class="m">Vide.</span>'}</div>`}
else if(mod=="VFX"){
v.innerHTML=`<h2>VFX — ${S.vfx.filter(x=>x.st!="TERMINÉ").length} RESTANT(S)</h2>`+S.vfx.map((x,i)=>`<div class="card row"><b class="mono">#${pad(i+1)}</b><input value="${esc(x.n)}" style="flex:1" onchange="S.vfx[${i}].n=this.value;save()"><input value="${esc(x.sw)}" placeholder="Logiciel" onchange="S.vfx[${i}].sw=this.value;save()"><select onchange="S.vfx[${i}].st=this.value;save();render()">${["À RÉALISER","EN COURS","TERMINÉ"].map(o=>`<option ${x.st==o?"selected":""}>${o}</option>`).join("")}</select><button onclick="S.vfx.splice(${i},1);save();render()">✕</button></div>`).join("")+`<button onclick="S.vfx.push({n:'Nouveau VFX',sw:'After Effects',st:'À RÉALISER'});save();render()">+ VFX</button>`}
else if(mod=="TIMELINE"){
const seg=[["ÉCRITURE",0,8],["PRÉPRODUCTION",8,14],["TOURNAGE",14,30],["MONTAGE",30,44],["SON",44,46],["VFX",46,47],["EXPORT",47,48]];
const el=(NOW()-S.start)/36e5;
v.innerHTML=`<h2>TIMELINE 48H — ÉCOULÉ <span class="mono">${hms(NOW()-S.start)}</span></h2><div class="card">`+seg.map(([n,a,b])=>{const p=Math.max(0,Math.min(100,(el-a)/(b-a)*100));return `<div class="row mono"><span style="width:150px">${pad(a)}H→${pad(b)}H ${n}</span><div class="bar" style="flex:1"><i style="width:${p}%"></i></div></div>`}).join("")+`</div>`}
else if(mod=="PANIC MODE"){const P=prog(),pr=problems(),left=S.deadline-NOW();
const rec=["Finaliser les plans manquants prioritaires","Supprimer les VFX non terminés","Exporter le master","Garder 20 minutes pour la livraison"];
v.innerHTML=`<h2 class="alert">PANIC MODE</h2><div class="card"><div class="m">TEMPS RESTANT</div><div class="big-t mono alert" style="font-size:48px">${hms(left)}</div></div><div class="grid"><div class="card">ÉCRITURE ${P[0]}%${bar(P[0])}</div><div class="card">TOURNAGE ${P[2]}%${bar(P[2])}</div><div class="card">POST-PROD ${P[3]}%${bar(P[3])}</div></div>
<div class="card"><b>PROBLÈMES</b>${pr.map(x=>`<div class="alert">${esc(x)}</div>`).join("")||"<div class='ok'>Aucun</div>"}</div><div class="card"><b>RECOMMANDATION</b><ol>${rec.map(r=>`<li>${r}</li>`).join("")}</ol></div><button class="big red" onclick="survie()">MODE SURVIE</button><div id="sv"></div>`}
else{

function shootPlan(){const g={};S.scenes.forEach((s,j)=>{const{loc,tod}=sl(s);(g[loc+"|"+tod]=g[loc+"|"+tod]||{loc,tod,sc:[]}).sc.push(j)});

async function homeJoin(){

  if(!DB)

  Object.assign(ME,{
    name:me,
    role:gv("h_jrole"),
    set:1
  });

  saveMe();
  hmsg("Vérification du code…");

  try{
    const r = await DB.joinRemoteProject(code);

    if(!r || !r.ok || !r.id){
      return hmsg("Code de projet invalide.");
    }

    const pid = r.id;

    let p = ALL.list[pid];

    if(!p){
      p = def();
      p.id = pid;

      Object.assign(p,{
        scenes:[],
        shots:[],
        cons:[]
      });

      ALL.list[pid] = p;

return `<div class="card"><div class="m">PROJET</div><div class="big-t">${esc(S.name)}</div><div class="mono ${e.need>e.left?"alert":"ok"}">${e.need>e.left?"⚠ Risque de dépassement : +"+Math.round(e.need-e.left)+" min":"✓ Dans les temps (estimation)"}</div></div><div class="card">${PH.map((n,i)=>`<div class="row" style="justify-content:space-between"><span>${n}</span><b class="mono">${P[i]}%</b></div>${bar(P[i])}`).join("")}</div><div class="card"><b>À FAIRE MAINTENANT</b>${ni>=0?`<div class="big-t" style="margin:8px 0">PLAN ${slab(ni)}</div><button class="big red" style="width:100%" onclick="S.cur=${ni};go('TOURNAGE','PLATEAU')">OUVRIR LE PLAN</button>`:'<div class="ok">Tous les plans sont validés.</div>'}${ut.map(t=>`<div>🔴 ${esc(t.n)}</div>`).join("")}</div>${PEERS.length>1?`<div class="card m mono">👥 ${PEERS.map(p=>esc(p.presence.name)).join(", ")}</div>`:""}`}
function mPlan(){const x=S.shots[S.cur];if(!x)return `<div class="card m">Aucun plan pour l'instant.</div>`;x.chk=x.chk||{};const sc=S.scenes[x.s]||{h:""};
return `<div class="row" style="justify-content:space-between"><button class="big" onclick="S.cur=Math.max(0,S.cur-1);render()">◀</button><span class="mono m">${S.cur+1}/${S.shots.length}</span><button class="big" onclick="S.cur=Math.min(S.shots.length-1,S.cur+1);render()">▶</button></div><div class="card"><div class="mono m">SCÈNE ${pad(x.s+1)} · PLAN ${slab(S.cur)} ${x.ok?'<span class="ok">✓ VALIDÉ</span>':""}</div><div class="big-t">${esc((x.t||"").toUpperCase())}</div><div class="mono">${esc(x.f||"")} mm · CAM ${esc(x.cam||"")} · ${esc(x.mv||"")} · ${x.d||0}s</div><div class="m">${esc(sc.h)}</div>${x.action?`<p>${esc(x.action)}</p>`:""}</div><div class="grid" style="grid-template-columns:1fr 1fr;gap:8px">${["Caméra","Objectif","Trépied","Lumière","Son","Acteur","Costume","Accessoire","Décor"].map(c=>`<label class="card" style="padding:10px;margin:0"><input type="checkbox" ${x.chk[c]?"checked":""} onchange="S.shots[S.cur].chk['${c}']=this.checked;save()"> ${c}</label>`).join("")}</div><br>${x.takes.map((t,i)=>`<div class="card row"><b class="mono">TAKE ${pad(i+1)}</b><select onchange="takeSt(${i},this.value)" style="flex:1">${ST.map(o=>`<option ${t.st==o?"selected":""}>${o}</option>`).join("")}</select></div>`).join("")}<button class="big" style="width:100%;margin-bottom:10px" onclick="addTake()">+ NOUVELLE PRISE</button><button class="big red" style="width:100%" onclick="S.shots[S.cur].ok=true;if(S.cur<S.shots.length-1)S.cur++;save();render()">PLAN VALIDÉ</button>`}
function mTasks(){return `<div class="row" style="justify-content:space-between"><b>${S.tasks.filter(t=>t.st!="TERMINÉE").length} TÂCHE(S)</b><button onclick="const n=prompt('Nouvelle tâche :');if(n){addTask({n});render()}">+ Ajouter</button></div><br>`+(S.tasks.map((t,i)=>`<div class="card row" style="${t.st=="TERMINÉE"?"opacity:.5":""}"><div style="flex:1"><div>${t.pr=="URGENTE"?"🔴 ":t.pr=="HAUTE"?"🟠 ":""}${esc(t.n)}</div><div class="m mono">${t.st}${t.who?" · "+esc(t.who):""}</div></div><button onclick="S.tasks[${i}].st=TS[(TS.indexOf(S.tasks[${i}].st)+1)%3];save();render()">${t.st=="À FAIRE"?"▶":t.st=="EN COURS"?"✓":"↺"}</button></div>`).join("")||'<p class="m">Aucune tâche.</p>')}
function mMore(){const it=[["Plan de tournage","PLAN DE TOURNAGE","PRÉPRODUCTION"],["Feuille de service","FEUILLE DE SERVICE","PRÉPRODUCTION"],["Scénario","SCÉNARIO","ÉCRITURE"],["Découpage","DÉCOUPAGE","PRÉPRODUCTION"],["Storyboard","STORYBOARD","PRÉPRODUCTION"],["Board des plans","BOARD","PLATEAU"],["Rushes","RUSHS","PLATEAU"],["Audio","AUDIO","PLATEAU"],["VFX","VFX","POST-PRODUCTION"],["Contraintes","CONTRAINTES","ÉCRITURE"],["Panic Mode","PANIC MODE","PANIC"]];if(!isJoiner())it.push(["Équipe & invitations","ÉQUIPE","SYSTÈME"],["Paramètres","PARAMÈTRES","SYSTÈME"]);
return it.map(([l,m,w])=>`<button class="big" style="width:100%;margin-bottom:8px;text-align:left" onclick="go('${m}','${w}')">${l}</button>`).join("")+`<button style="width:100%" onclick="leaveProject()">⎋ ${isJoiner()?"Quitter le projet":"Écran d'accueil"}</button>`}
function mobMore(){mobTab="more";render()}
function bnav(){const b=$i("bn");if(!b)return;const t=(k,ic,l,f)=>`<button class="${mobTab==k?"on":""}" onclick="${f}">${ic}<small>${l}</small></button>`;b.innerHTML=t("today","🏠","Aujourd'hui","go('DASHBOARD','PROJET')")+t("plan","🎬","Plan","go('TOURNAGE','PLATEAU')")+t("tasks","✅","Tâches","go('TÂCHES','PROJET')")+`<button onclick="toggleChat()">💬<small>Chat</small><span class="cbadge"></span></button>`+t("more","⋯","Plus","mobMore()")}
const _r7=render;render=function(){if(!MOB()){_r7();return}const v=$i("v");if(mobTab=="today")v.innerHTML=mToday();else if(mobTab=="plan")v.innerHTML=mPlan();else if(mobTab=="tasks")v.innerHTML=mTasks();else if(mobTab=="more")v.innerHTML=mMore();else{_r7();v.insertAdjacentHTML("afterbegin",`<button onclick="mobMore()" style="margin-bottom:10px">← Menu</button>`)}bnav();pSel()};
let rzT;addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(MOB())mobTab=mod=="TOURNAGE"?"plan":mod=="TÂCHES"?"tasks":mod=="DASHBOARD"?"today":"more";render()},200)});
$i("wss").insertAdjacentHTML("afterend",`<button onclick="leaveProject()" title="Quitter / écran d'accueil">⎋ Quitter</button>`);
if(MOB())mobTab="today";applyRole();

nav();render();tick();
</script></body></html>
