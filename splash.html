<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#090909;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

.splash{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:white;
}

.logo{
  width:300px;
  height:300px;
  object-fit:contain;
  display:block;
}

.title{
  margin-top:22px;
  font-size:28px;
  font-weight:800;
  letter-spacing:4px;
}

.subtitle{
  margin-top:8px;
  color:#888;
  font-size:12px;
  letter-spacing:3px;
}

.loader{
  width:220px;
  height:3px;
  margin-top:38px;
  background:#252525;
  overflow:hidden;
  border-radius:5px;
}

.loader::after{
  content:"";
  display:block;
  width:45%;
  height:100%;
  background:#fff;
  border-radius:5px;
  animation:loading 1.4s ease-in-out infinite;
}

@keyframes loading{
  0%{
    transform:translateX(-120%);
  }
  100%{
    transform:translateX(500%);
  }
}
</style>

</head>

<body>

<div class="splash">

  <img
  class="logo"
  src="assets/logo.png"
  alt="Logo 48H FILM DESK"
>

  <div class="loader"></div>

</div>

</body>
</html>
